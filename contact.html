<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Get in touch with June Makhubela — send a message via the contact form.">
    <title>Contact | June Makhubela</title>
    <link rel="stylesheet" href="./css/styles.css" />
</head>

<body>

    <a href="#main-content" class="skip-link">Skip to main content</a>

    <header>
        <h1>Contact Me</h1>
        <nav aria-label="Main Navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main id="main-content" id="contactMain">
        <h2>Get In Touch</h2>

        <!-- aria-live region that announces validation feedback to screen readers -->
        <div id="form-status" role="status" aria-live="polite" class="visually-hidden"></div>

        <form id="contactForm" action="send-email.php" method="POST" novalidate>

            <fieldset>
                <legend>Your Details</legend>

                <!-- Name Field -->
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" placeholder="e.g. John Doe" required minlength="2"
                    autocomplete="name" title="Please enter your full name (at least 2 characters)">

                <!-- Phone Number Field -->
                <label for="user-phone">Phone Number:</label>
                <input type="tel" id="user-phone" name="user-phone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"
                    placeholder="123-456-7890" required autocomplete="tel" title="Format: 123-456-7890">

                <!-- Email Field -->
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
            </fieldset>

            <fieldset>
                <legend>Your Message</legend>

                <!-- Message Field -->
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" placeholder="Write your message here…" required
                    minlength="10"></textarea>

                <!-- Preferred contact method -->
                <label for="contact-method">Preferred way to reach you:</label>
                <select id="contact-method" name="contact-method" required>
                    <option value="" disabled selected>Select an option…</option>
                    <option value="email">Email</option>
                    <option value="phone">Phone Call</option>
                    <option value="sms">Text Message (SMS)</option>
                </select>
            </fieldset>

            <!-- Submit Button -->
            <button type="submit">Send Message</button>
        </form>
    </main>

    <footer class="footer">
        <p>Contact me at <a href="mailto:junemakhubela@gmail.com" class="contactLink">junemakhubela@gmail.com</a></p>
    </footer>

</body>

</html>
